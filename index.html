<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Range and bearing between two points on a WARDOGS map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<title>WARDOGS · Range &amp; Bearing</title>
<style>
  /* Palette and type are borrowed from tarkov-squad-planner/src/index.css so
     the two tools read as one house style; token names match that file. */
  :root {
    --bg: #0c0e0d;
    --sur: #131614;
    --sur2: #191c18;
    --brd: #262b25;
    --brdm: #2c3129;
    --brds: #3a4038;
    --brdo: #23271f;
    --gold: #c9a84c;
    --goldtx: #e8c96a;
    --tx: #e4e0d4;
    --txt: #f4efe1;
    --txb: #e9e5d9;
    --txm: #9aa697;
    --txd: #8d998b;
    --txf: #6f7a6c;
    --txl: #4d564b;
    --pill: #101310;
    --red: #e06b6b;
    --grn: #66b778;
    --org: #e0913f;
    --man: #82c596;
    --val: #d86666;
    --lon: #5fa8d3;
    --letterbox: #090b0a;
    --hair: #1a1f19;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --disp: 'Rajdhani', 'Noto Sans', system-ui, sans-serif;
    --body: 'Noto Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }

  /* ==== component styles, in the order the design handoff describes them:
     setup overlay, header, map, solution rail. Everything above this line is
     the token vocabulary those rules are written in. ==== */
/* ---- shell / layout ---- */
.shell {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

.body {
  flex: 1;
  min-height: 0;
  display: flex;
}

/* ---- header ---- */
.hdr {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  height: 46px;
  flex: 0 0 auto;
  border-bottom: 1px solid var(--brd);
  background: var(--bg);
}

.hdr-mark {
  color: var(--gold);
  font-family: var(--disp);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .2em;
}

.hdr-div {
  width: 1px;
  height: 18px;
  background: var(--brd);
}

.hdr-sp {
  flex: 1;
}

.hdr-cursor {
  color: var(--txl);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  font-variant-numeric: tabular-nums;
}

.ctx {
  display: flex;
  align-items: center;
  gap: 9px;
  background: transparent;
  border: 1px solid var(--brdm);
  border-radius: 4px;
  padding: 4px 10px;
}

.ctx-map {
  color: var(--txt);
  font-family: var(--disp);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .08em;
}

.ctx-div {
  width: 1px;
  height: 12px;
  background: var(--brdm);
}

.ctx-wpn {
  color: var(--gold);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
}

.ctx-change {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
}

.ctx:hover {
  border-color: var(--gold);
}

/* ---- map ---- */
.map {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  background: var(--letterbox);
  touch-action: none;
  user-select: none;
  cursor: crosshair;
}

.map.is-panning {
  cursor: grabbing;
}

/* The overview and the finer tiles over it, under one tone filter so a tile
   never reads as a brighter patch than the ground around it. */
.ground {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.raster {
  position: absolute;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
  user-select: none;
}

.ground img {
  position: absolute;
  display: block;
  max-width: none;
  user-select: none;
}

.vig {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(12,14,13,0) 45%, rgba(12,14,13,.55) 100%);
}

.ovl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.ovl .glab text {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

/* These sit on terrain rather than in the margin, so they get a halo. */
.ovl .olab text {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  paint-order: stroke;
  stroke: var(--letterbox);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.pin {
  position: absolute;
  width: 0;
  height: 0;
  z-index: 5;
  cursor: grab;
  touch-action: none;
}

.pin-dot {
  position: absolute;
  left: -7px;
  top: -7px;
  display: block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--bg);
}

.pin-lbl {
  position: absolute;
  left: 18px;
  top: -9px;
  display: block;
  color: var(--txt);
  font-family: var(--disp);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .1em;
  white-space: nowrap;
  text-shadow: 0 1px 4px #000;
}

.pin-gun .pin-dot {
  background: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 2px 8px rgba(0,0,0,.8);
}

.pin-gun .pin-lbl {
  color: var(--gold);
}

.pin-tgt .pin-dot {
  background: var(--red);
  box-shadow: 0 0 0 1px var(--red), 0 2px 8px rgba(0,0,0,.8);
}

.pin-tgt .pin-lbl {
  color: var(--red);
}

.status {
  position: absolute;
  left: 10px;
  bottom: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(9,11,10,.8);
  border: 1px solid var(--hair);
  border-radius: 3px;
  padding: 3px 8px;
  pointer-events: none;
  color: var(--txl);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  font-variant-numeric: tabular-nums;
}

.north {
  position: absolute;
  right: 12px;
  top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  pointer-events: none;
}

.north-n {
  color: var(--gold);
  font-family: var(--disp);
  font-size: 13px;
  font-weight: 700;
}

.north-bar {
  width: 1px;
  height: 16px;
  background: linear-gradient(180deg, var(--gold), rgba(201,168,76,0));
}

/* ---- solution rail ---- */
.rail {
  flex: 0 0 306px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--brd);
  background: var(--bg);
  overflow-y: auto;
}

.sol {
  padding: 16px 16px 18px;
  border-bottom: 1px solid var(--brd);
  background: var(--pill);
}

.sol-range {
  display: flex;
  align-items: baseline;
}

.sol-num {
  font-family: var(--disp);
  font-size: 52px;
  font-weight: 700;
  line-height: .9;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}

.sol-unit {
  margin-left: 7px;
  color: var(--txf);
  font-family: var(--mono);
  font-size: 13px;
}

.sol-stats {
  display: flex;
  align-items: stretch;
  gap: 14px;
  margin-top: 10px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.stat-cap {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
}

.stat-val {
  font-family: var(--disp);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-brg {
  color: var(--tx);
}

.stat-drive {
  color: var(--txm);
}

.stat-rule {
  width: 1px;
  background: var(--brd);
}

.verdict {
  display: block;
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-align: center;
}

.sol-note {
  margin: 9px 0 0;
  color: var(--txl);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .1em;
  line-height: 1.5;
}

.ep {
  padding: 14px 16px;
  border-bottom: 1px solid var(--hair);
}

.ep-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.ep-dot {
  display: block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.ep-dot-gun {
  background: var(--gold);
}

.ep-dot-tgt {
  background: var(--red);
}

.ep-lbl {
  color: var(--tx);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
}

.ep-sp {
  flex: 1;
}

.ep-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.fld {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.fld-lbl {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
}

.fld-in {
  width: 100%;
  background: var(--sur2);
  border: 1px solid var(--brds);
  border-radius: 4px;
  color: var(--tx);
  outline: none;
  padding: 7px 9px;
  font-family: var(--mono);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}

.fld-in:focus {
  border-color: var(--gold);
}

.paste {
  width: 100%;
  margin-top: 8px;
  background: var(--pill);
  border: 1px solid var(--brdo);
  border-radius: 4px;
  color: var(--tx);
  outline: none;
  padding: 7px 9px;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  transition: border-color .2s;
}

.paste:focus {
  border-color: var(--brds);
}

.paste::placeholder {
  color: var(--txl);
}

.paste.is-ok {
  border-color: var(--grn);
}

.paste.is-bad {
  border-color: var(--red);
}

.chip {
  background: transparent;
  border: 1px solid var(--brdo);
  border-radius: 3px;
  color: var(--txf);
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .12em;
}

.chip:hover {
  border-color: var(--gold);
}

.chip.is-on {
  background: rgba(201,168,76,.14);
  border-color: var(--gold);
  color: var(--goldtx);
}

.saved {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 14px 16px;
}

.saved-head {
  display: flex;
  align-items: center;
  gap: 9px;
}

.saved-ttl {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .16em;
}

.saved-rule {
  flex: 1;
  height: 1px;
  background: var(--hair);
}

.saved-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.saved-empty {
  margin: 0;
  padding: 2px 0 4px;
  color: var(--brds);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
}

.srow {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--sur);
  border: 1px solid var(--brdo);
  border-radius: 4px;
  padding: 6px 6px 6px 10px;
}

.srow-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  background: transparent;
  border: 0;
  padding: 0;
  text-align: left;
}

.srow-main:hover {
  opacity: .75;
}

.srow-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--txb);
  font-family: var(--disp);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
}

.srow-coords {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}

.srow-range {
  padding: 0 2px;
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.srow-kill {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: transparent;
  border: 1px solid var(--brdo);
  border-radius: 3px;
  color: var(--txl);
  padding: 0;
  font-size: 13px;
}

.srow-kill:hover {
  border-color: var(--red);
  color: var(--red);
}

.newm {
  align-self: flex-start;
  margin-top: 2px;
  background: transparent;
  border: 1px solid var(--brdo);
  border-radius: 4px;
  color: var(--txl);
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
}

.newm:hover {
  border-color: var(--brds);
  color: var(--txd);
}

/* ---- setup overlay ---- */
.load-num {
  color: var(--txm);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .08em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.load-bar {
  height: 3px;
  margin-top: 12px;
  overflow: hidden;
  background: var(--brd);
  border-radius: 2px;
}

.load-fill {
  display: block;
  width: 0;
  height: 100%;
  background: var(--gold);
  transition: width .2s linear;
}

.load-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 30px;
  margin-top: 10px;
}

.load-note {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
}

.load-skip {
  flex: 0 0 auto;
  background: transparent;
  border: 1px solid var(--brds);
  border-radius: 4px;
  color: var(--gold);
  padding: 6px 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
  cursor: pointer;
  transition: border-color .15s;
}

.load-skip:hover {
  border-color: var(--gold);
}

.load-skip[hidden] {
  display: none;
}

.setup {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 34px;
  padding: 32px 20px;
  overflow: auto;
  background: var(--bg);
  animation: wdIn .18s ease;
}

.setup[hidden] {
  display: none;
}

@keyframes wdIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.wordmark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.wm-name {
  color: var(--gold);
  font-family: var(--disp);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: .24em;
  line-height: 1;
}

.wm-sub {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .2em;
}

.step {
  width: 100%;
  max-width: 760px;
  opacity: 1;
  transition: opacity .15s ease;
}

.step-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.step-lbl {
  color: var(--gold);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
}

.step-rule {
  flex: 1;
  height: 1px;
  background: var(--brd);
}

.step.is-waiting {
  opacity: .42;
}

.map-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 10px;
}

.mcard {
  position: relative;
  overflow: hidden;
  height: 118px;
  display: flex;
  align-items: flex-end;
  background: var(--sur);
  border: 1px solid var(--brd);
  border-radius: 6px;
  padding: 0;
  cursor: pointer;
  transition: border-color .15s;
}

.mcard:hover,
.mcard.is-on {
  border-color: var(--gold);
}

.mcard-art {
  position: absolute;
  inset: 0;
  display: block;
  background-size: cover;
  background-position: center;
  opacity: .85;
  filter: saturate(.4) brightness(.62) contrast(1.15);
}

.mcard-scrim {
  position: absolute;
  inset: 0;
  display: block;
  background: linear-gradient(180deg, rgba(12,14,13,.25), rgba(12,14,13,.92));
}

.mcard-txt {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 14px;
  color: var(--txt);
  text-align: left;
}

.mcard-name {
  color: var(--txt);
  font-family: var(--disp);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1.1;
}

.mcard-note {
  color: var(--txf);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  font-variant-numeric: tabular-nums;
}

.mcard-note.is-ok {
  color: var(--grn);
}

.mcard-note.is-part {
  color: var(--org);
}

.wpn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 10px;
}

.wcard {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: var(--sur);
  border: 1px solid var(--brd);
  border-radius: 6px;
  padding: 16px;
  cursor: pointer;
  transition: border-color .15s;
}

.wcard:hover,
.wcard.is-on {
  border-color: var(--gold);
}

.wcard-txt {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  text-align: left;
}

.wcard-name {
  color: var(--txt);
  font-family: var(--disp);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1.1;
}

.wcard-sub {
  color: var(--txd);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
}

.wcard-band {
  flex: 0 0 auto;
  color: var(--gold);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .06em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
  /* ==== end component styles ==== */
</style>

</head>
<body>
<div class="shell">

  <header class="hdr">
    <span class="hdr-mark">WARDOGS</span>
    <span class="hdr-div"></span>
    <button class="ctx" id="ctxBtn" type="button">
      <span class="ctx-map" id="ctxMap">—</span>
      <span class="ctx-div"></span>
      <span class="ctx-wpn" id="ctxWpn">—</span>
      <span class="ctx-change">CHANGE</span>
    </button>
    <span class="hdr-sp"></span>
    <span class="hdr-cursor" id="cursorOut"></span>
  </header>

  <div class="body">

    <div class="map" id="map">
      <div class="ground" id="ground">
        <div class="raster" id="raster"></div>
      </div>
      <div class="vig"></div>
      <svg class="ovl" id="ovl"></svg>
      <div class="pin pin-gun" id="pinGun" hidden>
        <span class="pin-dot"></span>
        <span class="pin-lbl" id="pinGunLbl">MORTAR</span>
      </div>
      <div class="pin pin-tgt" id="pinTgt" hidden>
        <span class="pin-dot"></span>
        <span class="pin-lbl">TARGET</span>
      </div>
      <div class="status">
        <span id="scaleOut"></span>
        <span id="hintOut"></span>
      </div>
      <div class="north">
        <span class="north-n">N</span>
        <span class="north-bar"></span>
      </div>
    </div>

    <aside class="rail">

      <section class="sol">
        <div class="sol-range">
          <span class="sol-num" id="rangeOut">—</span>
          <span class="sol-unit">m</span>
        </div>
        <div class="sol-stats">
          <div class="stat">
            <span class="stat-cap">BEARING</span>
            <span class="stat-val stat-brg" id="brgOut">—</span>
          </div>
          <span class="stat-rule"></span>
          <div class="stat">
            <span class="stat-cap">DRIVE</span>

  function clampPoint(p) {

        return r && Core.finitePoint(r);

  // grey. Each map's slope/intercept was measured against a real capture, so
  // those numbers drive the filter rather than one blanket guess.
  //
  // CSS applies brightness() then contrast() as out = in*b*c + 0.5*(1 - c),
  // which is the same straight line written differently, so solving that pair
  // recovers b and c. The order matters and is not free to choose: contrast
  // first drives every bright pixel past 1, where it clamps, and the following
  // brightness then flattens all of them to one flat olive. Dimming first
  // keeps the whole range inside the channel and lets only the shadows clip,

  /* ---- finer ground ----

     512 px over 16,384 m is 0.5 m per pixel. The coarse levels cover the whole

     exists off the disk and writes it in below -- each level's extent, each
     map's size, and a version that changes with any map file -- so nothing is
     asked for that was not cut; an unbuilt page has none and draws the

  var TILE_PX = 512;
  var OVERVIEW_PX = 2560;
  var TILE_MARGIN = 160;  // screen px round the view whose tiles are decoded ahead of a pan
  var TILES = {"v":"07738cc59d","maps":{"bakurani":{"bytes":26262786,"levels":{"8":[0,0,8,8],"16":[0,0,16,16],"32":[9,13,23,28]}},"ozeti":{"bytes":33694882,"levels":{"8":[0,0,8,8],"16":[0,0,16,16],"32":[12,12,26,27],"64":[32,33,45,46]}},"zestafona":{"bytes":20232718,"levels":{"8":[0,0,8,8],"16":[0,0,16,16],"32":[6,5,21,20],"64":[21,18,34,31]}}}};

  function tileUrl(id) { return mapUrl("tiles/" + id + ".webp"); }

  /* ---- the map download ----
     Blurry patches are the board waiting on the network one square at a
     time. So the first time a map is picked, every tile it has is fetched up
     front -- while the player chooses a weapon, then behind a progress bar --
     and kept in Cache Storage, where the next visit finds it and reads it off
     the disk instead. Either way each square is in memory before it is ever
     on screen. START ANYWAY lets the player in early: the download carries on
     underneath, coarse levels first so the whole map has sharper ground under
     it soonest, and anything on screen that has not arrived yet is fetched
     directly. */

  var PACK_WORKERS = 16;

  var cacheOpen = null;

  function openCache() {
    if (cacheOpen) return cacheOpen;
    cacheOpen = Promise.resolve(null);
    try {
      if (window.caches && TILES.v) {
        cacheOpen = caches.open(PACK_CACHE).then(function (c) {
          // A recut changes the version, and the old one's tiles are dead weight.
          caches.keys().then(function (names) {
            names.forEach(function (n) {

            });

        }

      lv.sort(function (p, q) { return p.d - q.d; });

  /* ---- drawing the tiles ---- */
  function tileBox(n) {

  }
  function placeTile(n, box) {

  // A tile counts as ready once it is decoded, not merely downloaded, so
  // nothing that replaces it is taken down while it would still paint blank.
  function tileNode(map, t) {

        } else {

  function drawTiles() {
    var map = mapId(), W = state.size.w, H = state.size.h, cover = tileCover(map);
    var m = TILE_MARGIN / k();
    var tl = toWorld({ x: 0, y: 0 }), br = toWorld({ x: W, y: H });

      { minX: tl.x - m, maxX: br.x + m, minY: br.y - m, maxY: tl.y + m },

      // stands in for it, rather than the overview far below.

    elStep2.classList.toggle("is-waiting", !s.map);

    setText(elCtxWpn, s.weapon ? w.short : "—");
    setText(elCursor, s.cursor
      ? "X " + fmt(s.cursor.x) + " Y " + fmt(s.cursor.y)

    elVerdict.style.borderColor = env ? colour + "55" : C_CHIPBRD;

    setValue(fields.guny, fieldStr("gun", "y"));

  }

  function drawOverlay(w, env) {
    var s = state, parts = [];
    var kk = k(), W = s.size.w, H = s.size.h;
    var d = mapDef();

    /* ground nobody can stand on, shaded back */
    if (d.exact && d.play) {
      var p0 = toScreen({ x: d.play.minX, y: d.play.maxY });
      var p1 = toScreen({ x: d.play.maxX, y: d.play.minY });
      [{ x: 0, y: 0, w: W, h: p0.y },
       { x: 0, y: p1.y, w: W, h: H - p1.y },
       { x: 0, y: p0.y, w: p0.x, h: p1.y - p0.y },
       { x: p1.x, y: p0.y, w: W - p1.x, h: p1.y - p0.y }].forEach(function (r) {
        if (r.w > 0 && r.h > 0) {
          parts.push('<rect x="' + r.x.toFixed(1) + '" y="' + r.y.toFixed(1) +
            '" width="' + r.w.toFixed(1) + '" height="' + r.h.toFixed(1) +
            '" fill="rgba(9,11,10,.62)"/>');
        }
      });
      parts.push('<rect x="' + p0.x.toFixed(1) + '" y="' + p0.y.toFixed(1) +
        '" width="' + (p1.x - p0.x).toFixed(1) + '" height="' + (p1.y - p0.y).toFixed(1) +
        '" fill="none" stroke="rgba(201,168,76,.4)" stroke-width="1" stroke-dasharray="8 6"/>');
    }

    /* grid */
    var step = Core.gridStep(kk);
    var wtl = toWorld({ x: 0, y: 0 }), wbr = toWorld({ x: W, y: H });
    var loX = Math.max(0, wtl.x), hiX = Math.min(TERRAIN, wbr.x);
    var loY = Math.max(0, wbr.y), hiY = Math.min(TERRAIN, wtl.y);
    function vline(x, o) {
      var px = toScreen({ x: x, y: 0 }).x.toFixed(1);
      parts.push('<line x1="' + px + '" y1="0" x2="' + px + '" y2="' + H +
        '" stroke="' + C_GOLD + '" stroke-opacity="' + o + '" stroke-width="1"/>');
    }
    function hline(y, o) {
      var py = toScreen({ x: 0, y: y }).y.toFixed(1);
      parts.push('<line x1="0" y1="' + py + '" x2="' + W + '" y2="' + py +
        '" stroke="' + C_GOLD + '" stroke-opacity="' + o + '" stroke-width="1"/>');
    }
    if (step.minor) {
      for (var fx = Math.ceil(loX / step.minor) * step.minor; fx <= hiX; fx += step.minor) {
        if (fx % step.major) vline(fx, 0.09);
      }
      for (var fy = Math.ceil(loY / step.minor) * step.minor; fy <= hiY; fy += step.minor) {
        if (fy % step.major) hline(fy, 0.09);
      }
    }
    var labels = [];
    for (var gx = Math.ceil(loX / step.major) * step.major; gx <= hiX; gx += step.major) {
      vline(gx, 0.28);
      labels.push('<text x="' + (toScreen({ x: gx, y: 0 }).x + 4).toFixed(1) +
        '" y="13" fill="' + C_EDGE + '" text-anchor="start">' + (gx / UNIT).toFixed(0) + '</text>');
    }
    for (var gy = Math.ceil(loY / step.major) * step.major; gy <= hiY; gy += step.major) {
      hline(gy, 0.28);
      labels.push('<text x="5" y="' + (toScreen({ x: 0, y: gy }).y - 4).toFixed(1) +
        '" fill="' + C_EDGE + '" text-anchor="start">' + (gy / UNIT).toFixed(0) + '</text>');
    }

    /* the fixed ground a player orients by: the zone and the three bases */
    var ground = GROUND[mapId()], names = [];
    ground.bases.forEach(function (b) {
      var f = FACTIONS[b.side];
      var pts = b.pts.map(function (p) { return toScreen({ x: p[0], y: p[1] }); });
      var top = Math.min.apply(null, pts.map(function (p) { return p.y; }));
      var mid = pts.reduce(function (sum, p) { return sum + p.x; }, 0) / pts.length;
      parts.push('<polygon points="' + pts.map(function (p) {
        return p.x.toFixed(1) + "," + p.y.toFixed(1);
      }).join(" ") + '" fill="' + f.colour + '" fill-opacity=".16" stroke="' + f.colour +
        '" stroke-opacity=".85" stroke-width="1.2"/>');
      names.push('<text x="' + mid.toFixed(1) + '" y="' + (top - 6).toFixed(1) +
        '" fill="' + f.colour + '" text-anchor="middle">' + f.name + '</text>');
    });
    if (ground.zone) {
      var zc = toScreen(ground.zone), zr = ground.zone.r * kk;
      parts.push('<circle cx="' + zc.x.toFixed(1) + '" cy="' + zc.y.toFixed(1) +
        '" r="' + zr.toFixed(1) + '" fill="' + C_ZONE + '" fill-opacity=".06" stroke="' + C_ZONE +
        '" stroke-opacity=".6" stroke-width="1.2"/>');
      names.push('<text x="' + zc.x.toFixed(1) + '" y="' + (zc.y - zr - 6).toFixed(1) +
        '" fill="' + C_ZONE + '" fill-opacity=".85" text-anchor="middle">CONTROL ZONE</text>');
    }
    parts.push('<g class="olab">' + names.join("") + '</g>');

    /* what the gun can reach from where it stands */
    if (s.gun) {
      var g = toScreen(s.gun);
      function ring(r, stroke, o, width, dash) {
        parts.push('<circle cx="' + g.x.toFixed(1) + '" cy="' + g.y.toFixed(1) +
          '" r="' + Math.max(1, r).toFixed(1) + '" fill="none" stroke="' + stroke +
          '" stroke-opacity="' + o + '" stroke-width="' + width + '" stroke-dasharray="' + dash + '"/>');
      }
      ring(w.min * kk, C_GOLD, 0.5, 1, "5 5");
      ring(w.max * kk, C_GOLD, 0.65, 1.2, "5 5");
      if (w.lowArcFrom) ring(w.lowArcFrom * kk, C_ORG, 0.35, 1, "2 6");
    }

    /* the shot itself, coloured by whether it is on */
    if (s.gun && s.target) {
      var a = toScreen(s.gun), b = toScreen(s.target);
      parts.push('<line x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
        '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
        '" stroke="' + (env ? VERDICT[env.level] : C_GOLD) +
        '" stroke-width="1.5" stroke-opacity=".85"/>');
    }

    elOvl.innerHTML = parts.join("") + '<g class="glab">' + labels.join("") + '</g>';
  }

  function drawPins(w, sol) {
    function place(el, p) {
      if (!p) { el.hidden = true; return; }
      var sp = toScreen(p);
      el.hidden = false;
      el.style.left = sp.x.toFixed(1) + "px";
      el.style.top = sp.y.toFixed(1) + "px";
    }
    setText(elPinGunLbl, w.short);
    place(elPinGun, state.gun);
    place(elPinTgt, state.target);
  }

  function drawSaved() {
    var list = savedList();
    if (!list.length) {
      elSavedList.innerHTML = '<p class="saved-empty">NOTHING SAVED ON THIS MAP</p>';
      return;
    }
    var g = state.gun;
    elSavedList.innerHTML = list.map(function (row) {
      var r = g ? Math.hypot(row.x - g.x, row.y - g.y) : null;
      var colour = r === null ? C_DEAD : VERDICT[Core.envelope(r, weapon()).level];
      return '<div class="srow" data-id="' + row.id + '">' +
        '<button class="srow-main" type="button">' +
        '<span class="srow-name"></span>' +
        '<span class="srow-coords">' + fmt(row.x) + " / " + fmt(row.y) + '</span>' +
        '</button>' +
        '<span class="srow-range" style="color:' + colour + '">' +
        (r === null ? "—" : Math.round(r) + " m") + '</span>' +
        '<button class="srow-kill" type="button" aria-label="Delete">×</button>' +
        '</div>';
    }).join("");
    // Names are user text, so they go in as text rather than as markup.
    Array.prototype.forEach.call(elSavedList.querySelectorAll(".srow-name"), function (el, i) {
      el.textContent = list[i].name;
    });
  }

  /* ---- placing and adjusting ---- */
  function setPoint(which, world, advance) {
    var p = clampPoint(world);
    delete state.draft[which + "x"];
    delete state.draft[which + "y"];
    state[which] = p;
    if (advance && which === "gun") state.arm = "target";
    persist();
    requestRender();
  }

  var startPan = null, lastHover = null;

  elMap.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    var r = elMap.getBoundingClientRect();
    startPan = { x: e.clientX, y: e.clientY, cx: state.view.cx, cy: state.view.cy, moved: false, r: r };
    state.drag = { kind: "pan" };
    requestRender();
  });

  function grab(which) {
    return function (e) {
      if (e.button !== 0) return;
      e.stopPropagation();
      e.preventDefault();
      startPan = { x: e.clientX, y: e.clientY, moved: false, r: elMap.getBoundingClientRect() };
      state.drag = { kind: which };
      requestRender();
    };
  }
  elPinGun.addEventListener("pointerdown", grab("gun"));
  elPinTgt.addEventListener("pointerdown", grab("target"));

  window.addEventListener("pointermove", function (e) {
    var drag = state.drag;
    if (!drag || !startPan) return;
    var dx = e.clientX - startPan.x, dy = e.clientY - startPan.y;
    // Three pixels of slop: a click that shifts a hair is still a click.
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) startPan.moved = true;
    if (drag.kind === "pan") {
      if (!startPan.moved) return;
      var kk = k();
      state.view = { cx: startPan.cx - dx / kk, cy: startPan.cy + dy / kk, span: state.view.span };
      requestRender();
    } else {
      setPoint(drag.kind, toWorld({ x: e.clientX - startPan.r.left, y: e.clientY - startPan.r.top }), false);
    }
  });

  function endDrag(e) {
    var drag = state.drag;
    if (!drag) return;
    if (drag.kind === "pan" && startPan && !startPan.moved) {
      // Where the click landed, not where the pointer was last seen moving:
      // a pointer that arrives and clicks without ever moving -- a tap, or a
      // synthetic click -- has no hover history to fall back on.
      var at = e && e.clientX !== undefined
        ? toWorld({ x: e.clientX - startPan.r.left, y: e.clientY - startPan.r.top })
        : lastHover;
      if (at) setPoint(state.arm, at, true);
    }
    state.drag = null;
    persist();
    requestRender();
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  elMap.addEventListener("pointermove", function (e) {
    var r = elMap.getBoundingClientRect();
    var world = toWorld({ x: e.clientX - r.left, y: e.clientY - r.top });
    lastHover = world;
    if (!state.drag) { state.cursor = world; requestRender(); }
  });
  elMap.addEventListener("pointerleave", function () {
    if (state.cursor) { state.cursor = null; requestRender(); }
  });

  // Native and not passive: the page must be allowed to swallow the scroll.
  elMap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = elMap.getBoundingClientRect();
    var px = e.clientX - r.left, py = e.clientY - r.top;
    var world = toWorld({ x: px, y: py });
    var span = Math.min(maxSpan(), Math.max(MIN_SPAN, state.view.span * Math.exp(e.deltaY * 0.0014)));
    var kk = Math.min(state.size.w, state.size.h) / span;
    state.view = {
      span: span,
      cx: world.x - (px - state.size.w / 2) / kk,
      cy: world.y + (py - state.size.h / 2) / kk
    };
    requestRender();
  }, { passive: false });

  elMap.addEventListener("dblclick", function () {
    state.view = homeView(state.size);
    requestRender();
  });

  /* ---- coordinate fields ---- */
  // A field holds an uncommitted draft while it is being typed into. Binding
  // the value straight to a 2dp format makes the field untypable: "1"
  // reformats to "1.00" and the caret lands after it, so 103.83 can never be
  // reached. The draft owns the display; the point still follows whatever
  // parses, so the map moves as you type.
  function writeAxis(which, axis, raw) {
    state.draft[which + axis] = String(raw);
    var v = parseFloat(String(raw).replace(",", "."));
    if (isFinite(v)) {
      var cur = state[which] || { x: 0, y: 0 };
      var p = { x: cur.x, y: cur.y };
      p[axis] = v * UNIT;
      state[which] = clampPoint(p);
      persist();
    }
    requestRender();
  }
  function nudge(which, axis, e) {
    if (e.key === "Enter") { e.currentTarget.blur(); return; }
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    var cur = state[which];
    if (!cur) return;
    e.preventDefault();
    // Step from the committed value, never from half-typed text.
    delete state.draft[which + axis];
    var p = { x: cur.x, y: cur.y };
    p[axis] += (e.shiftKey ? 10 : 1) * (e.key === "ArrowUp" ? 1 : -1);
    state[which] = clampPoint(p);
    persist();
    requestRender();
  }
  ["gun", "target"].forEach(function (which) {
    ["x", "y"].forEach(function (axis) {
      var el = fields[which + axis];
      el.addEventListener("input", function () { writeAxis(which, axis, el.value); });
      el.addEventListener("keydown", function (e) { nudge(which, axis, e); });
      el.addEventListener("blur", function () {
        delete state.draft[which + axis];
        requestRender();
      });
    });
  });

  /* ---- a coordinate marked in game and pasted out of chat ---- */
  var pasteTimer = null;
  function takePaste(text) {
    var p = Core.gamePoint(text, UNIT);
    if (!p) {
      elPaste.classList.remove("is-ok");
      elPaste.classList.add("is-bad");
      return false;
    }
    setPoint("target", p, false);
    elPaste.value = "";
    elPaste.classList.remove("is-bad");
    elPaste.classList.add("is-ok");
    clearTimeout(pasteTimer);
    pasteTimer = setTimeout(function () { elPaste.classList.remove("is-ok"); }, 700);
    return true;
  }
  elPaste.addEventListener("paste", function (e) {
    var text = e.clipboardData && e.clipboardData.getData("text");
    if (!text || !Core.parsePair(text)) return;   // let an unparseable paste land and be edited
    e.preventDefault();
    takePaste(text);
  });
  elPaste.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    takePaste(elPaste.value);
  });
  elPaste.addEventListener("input", function () {
    if (!elPaste.value) elPaste.classList.remove("is-bad");
  });

  /* ---- rail controls ---- */
  elArmGun.addEventListener("click", function () { state.arm = "gun"; requestRender(); });
  elArmTgt.addEventListener("click", function () { state.arm = "target"; requestRender(); });

  $("saveBtn").addEventListener("click", function () {
    if (!state.target || !state.map) return;
    var list = savedList().slice();
    list.unshift({ id: Date.now(), name: "Target " + (list.length + 1),
                   x: state.target.x, y: state.target.y });
    state.saved[state.map] = list.slice(0, SAVED_CAP);
    persist();
    requestRender();
  });
  $("newBtn").addEventListener("click", function () {
    state.target = null;
    state.arm = "target";
    delete state.draft.targetx;
    delete state.draft.targety;
    persist();
    requestRender();
  });
  elSavedList.addEventListener("click", function (e) {
    var row = e.target.closest(".srow");
    if (!row) return;
    var id = row.getAttribute("data-id");
    var hit = savedList().filter(function (r) { return String(r.id) === id; })[0];
    if (!hit) return;
    if (e.target.closest(".srow-kill")) {
      state.saved[state.map] = savedList().filter(function (r) { return String(r.id) !== id; });
    } else {
      setPoint("target", { x: hit.x, y: hit.y }, false);
    }
    persist();
    requestRender();
  });

  /* ---- setup ---- */
  $("ctxBtn").addEventListener("click", function () {
    state.setupOpen = true;
    state.holding = false;
    requestRender();
  });
  elMapGrid.addEventListener("click", function (e) {
    var b = e.target.closest(".mcard");
    if (!b) return;
    // Picking a map is destructive on purpose: it doubles as start over.
    state.map = b.getAttribute("data-id");
    state.holding = false;
    loadPack(state.map);
    state.gun = null;
    state.target = null;
    state.arm = "gun";
    state.draft = {};
    state.view = homeView(state.size);
    persist();
    requestRender();
  });
  elWpnGrid.addEventListener("click", function (e) {
    var b = e.target.closest(".wcard");
    if (!b) return;
    state.weapon = b.getAttribute("data-id");
    // With the map still downloading, the setup stays up as a loading screen
    // and closes itself when the last tile lands.
    state.setupOpen = !state.map || !packReady(state.map);
    state.holding = state.setupOpen && !!state.map;
    persist();
    requestRender();
  });
  elLoadSkip.addEventListener("click", function () {
    state.holding = false;
    state.setupOpen = false;
    requestRender();
  });

  /* ---- boot ---- */
  var sized = false;
  function measure() {
    var r = elMap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    state.size = { w: r.width, h: r.height };
    if (!sized) { sized = true; state.view = homeView(state.size); }
    requestRender();
  }
  load();
  if (state.map) loadPack(state.map);
  buildCards();
  new ResizeObserver(measure).observe(elMap);
  measure();
  render();
})();
</script>

</body>
</html>
